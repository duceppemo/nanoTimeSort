name: Sync wiki

# docs/wiki/ on master is the source of truth for the GitHub wiki.
# Any change to it is pushed to the wiki automatically; do not edit the wiki
# directly, your changes would be overwritten by the next sync.
# The daily schedule re-drives the mirror if a sync run ever failed.

on:
  push:
    branches: [master]
    paths: ["docs/wiki/**"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Serialize runs so an older sync can never race a newer one on the push.
concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Always sync from master, even when dispatched from another ref.
          ref: master
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
      - name: Mirror docs/wiki to the wiki
        run: |
          rsync -av --delete --exclude .git docs/wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from docs/wiki @ ${GITHUB_SHA::7}"
          git push
