name: Sync wiki

# docs/wiki/ in this repository is the source of truth for the GitHub wiki.
# Any change to it on master is pushed to the wiki automatically; do not edit
# the wiki directly, your changes would be overwritten by the next sync.

on:
  push:
    branches: [master]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Push docs/wiki to the GitHub wiki
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo
          rsync -av --delete --exclude .git docs/wiki/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from docs/wiki @ ${GITHUB_SHA::7}"
          git push
